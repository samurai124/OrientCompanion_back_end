spring.application.name=OrientCompanion

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/orientcompanion_1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
#spring.flyway.clean-on-validation-error=true

# --- JWT (noms lus par JwtService : jwt.secret / jwt.expiration-ms) ---
jwt.secret=key
jwt.expiration-ms=86400000

# --- LLM (Gemini, via la couche de compatibilité OpenAI de Google) ---


# --- Scoring (poids du moteur de recommandation) ---
scoring.weights.interest=0.30
scoring.weights.personality=0.40
scoring.weights.academic=0.30
scoring.fusion.structured=0.60
scoring.fusion.vector=0.40

# --- Swagger / SpringDoc ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

server.port=8080