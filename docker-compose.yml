services:
  frontend:
    build:
      context: ../OrientCompanion_front
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-}
    container_name: orientcompanion-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - orientcompanion-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orientcompanion-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mariadb:3306/${MARIADB_DATABASE:-orientcompanion}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MARIADB_USER:-orientuser}
      - SPRING_DATASOURCE_PASSWORD=${MARIADB_PASSWORD:-orientpassword}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-7f8b2c9a1d4e6f3a0c5b8d2e9f1a4b7c3d6e8f0a2b5c7d9e1f3a6b8c0d2e4f6a}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - GEMINI_API_MODEL=${GEMINI_API_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orientcompanion-network

  mariadb:
    image: mariadb:11.4
    container_name: orientcompanion-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-orientcompanion}
      MYSQL_USER: ${MARIADB_USER:-orientuser}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-orientpassword}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orientcompanion-network

  redis:
    image: redis:7-alpine
    container_name: orientcompanion-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orientcompanion-network

volumes:
  mariadb_data:
    name: orientcompanion_mariadb_data
  redis_data:
    name: orientcompanion_redis_data

networks:
  orientcompanion-network:
    driver: bridge
